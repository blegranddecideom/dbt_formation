models:
  - name: fct__orders
  
    latest_version: 1
    versions:
    - v: 2
      columns:
        - include: "*"
          exclude:
            - coupon_amount
        - name: last_payment_created_at
          data_type: date
    - v: 1
      config:
        alias: fct__orders

    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: int
        constraints:
          - type: not_null
          - type: unique
      - name: customer_id
        data_type: int           
      - name: order_date
        data_type: date
      - name: amount
        data_type: number
      - name: bank_transfer_amount
        data_type: number
      - name: credit_card_amount
        data_type: number
      - name: coupon_amount
        data_type: number
      - name: gift_card_amount
        data_type: number
      - name: status
        data_type: text

  - name: dim__customers
    description: Staging table for all customer
    columns:
      - name: first_name    
        description: Column with the customer first name
        tests:
          - dbt_utils.not_empty_string
      - name: last_name    
        description: Column with the customer last name
        tests:
          - dbt_utils.not_empty_string
      - name: email    
        description: Column with the customer email
        tests:
          - dbt_utils.not_empty_string

