models:
  - name: stg__customers
    columns:
      - name: customer_id    
        data_tests:
          - unique
          - not_null

  - name: stg__orders
    columns:
      - name: order_id    
        data_tests:
          - unique
      - name: status    
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed','placed','return_pending','returned','shipped']
      - name: customer_id    
        data_tests:
          - relationships:
              arguments:
                to: ref('stg__customers')
                field: customer_id