models:
  - name: stg__customers
    description: Staging table for all customer
    columns:
      - name: customer_id    
        description: Column for Customer ID
        tests:
          - unique
          - not_null

  - name: stg__orders
    columns:
      - name: order_id    
        tests:
          - unique
      - name: status  
        description : "{{doc('order_status')}}"
        tests:
          - accepted_values:
              arguments:
                values: ['completed','placed','return_pending','returned','shipped']
      - name: customer_id    
        tests:
          - relationships:
              arguments:
                to: ref('stg__customers')
                field: customer_id